services:
  - type: web
    name: public-records
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: records-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ID_HASH_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
